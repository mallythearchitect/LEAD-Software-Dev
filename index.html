  --t-blue:#3d6fe8; --t-green:#34a72d; --t-orange:#f2651a; --t-gold:#e9a10c; --t-slate:#5a6b96;
  --t-indigo:#4a62dd; --t-sky:#3a8ee6; --t-teal:#25a08b; --t-pine:#379a42; --t-violet:#5d70e6; --t-plum:#d8661f; --t-brick:#e35f1f;
  --hero:#13235a; --hero2:#1a2d6b; --hero-dim:#aebde3; --ring:#eaf0ff;
  --topbar:rgba(10,19,48,.86); --shadow:0 14px 44px rgba(0,4,20,.55) }
:root[data-theme="dark"] body{background:radial-gradient(1200px 500px at 85% -120px,rgba(47,96,219,.22),transparent 70%),var(--bg) fixed}

/* ---------- wider page, smaller margins ---------- */
.topbar,.appstrip,.stage,.shell-foot{max-width:var(--wrap)}
.topbar{padding-left:var(--pad);padding-right:var(--padr);min-height:58px;padding-block:8px}
.appstrip{padding-left:calc(var(--pad) - 6px);padding-right:var(--padr)}
.stage{padding:14px var(--padr) 96px var(--pad)}
.shell-foot{padding-left:var(--pad);padding-right:var(--padr)}
.content{max-width:none}

/* ---------- the top bar: LEAD logo, status out at the edge ---------- */
.brand{gap:10px}
.brand .mark{display:none}
.brand-logo{height:32px;width:auto;display:block}
.brand-txt b{display:none}
.brand-txt small{font-size:12.5px;font-weight:600;color:var(--muted);border-left:1px solid var(--line);padding-left:10px;white-space:nowrap}
.home-btn{gap:6px;padding:5px 12px 5px 7px}
.home-logo{height:19px;width:auto;display:block}
.home-btn span{display:none}
.status{margin-left:2px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12px}
.status i.on{background:var(--lead-green);box-shadow:0 0 0 3px color-mix(in srgb,var(--lead-green) 25%,transparent)}
.viewpick select{max-width:200px}
.btn.pri,.add-btn{background:var(--lead-blue);border-color:var(--lead-blue);color:#fff}
.appstrip button[aria-current="page"]{border-bottom-color:var(--lead-gold)}
.appstrip .grp{color:var(--muted)}
.c-rows button[aria-selected="true"]{border-bottom-color:var(--lead-gold)}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);cursor:pointer;font:inherit;font-weight:600;text-align:left}
.linkbtn:hover{text-decoration:underline}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Home ---------- */
.th{gap:14px;padding-top:2px}
.th .c-top{grid-template-columns:1fr}
.th .c-hello{font-size:clamp(28px,3.6vw,42px)}
.th-tabs{border-bottom:1px solid var(--line);margin-bottom:0;gap:2px}
.th-tabs button{font-size:18px;padding:6px 12px 9px}
.th-body{display:flex;flex-direction:column;gap:14px;min-width:0}
.th .sec{margin-top:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.th .sec .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.th .sec .h .meta{font-size:13px;color:var(--muted)}
.th-today{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px 16px;min-width:0}
.th-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.th-h h2{font-size:21px}
.th-h .meta{font-size:13px;color:var(--muted)}
.th-ms{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:10px}
.th-m{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface2);border:1px solid transparent;border-radius:14px;padding:12px 14px 12px 16px;color:var(--ink);font:inherit;min-width:0;position:relative;overflow:hidden}
button.th-m{cursor:pointer}
button.th-m:hover,button.th-m:focus-visible{border-color:var(--tc)}
.th-m::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc)}
.th-m .l{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.th-m b{font:800 28px/1.05 var(--display);letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th-m b small{font:600 14px var(--body);color:var(--muted);letter-spacing:0}
.th-m .s{font-size:12.5px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.th-m .s u{color:var(--blue);text-decoration:none;font-weight:700}
.th-m .late,.th .late{color:var(--red);font-weight:600}
.th .soon{color:var(--orange);font-weight:600}
.th-bar{display:block;height:5px;border-radius:3px;background:var(--line);margin:3px 0 5px;overflow:hidden}
.th-bar i{display:block;height:100%;background:var(--lead-green);border-radius:3px}
.th-byc{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:13px;color:var(--muted);align-items:baseline}
.th-byc .l{font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.08em}
.th-byc b{color:var(--ink)}

.th-secs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.th-sec{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--tc);border-radius:16px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.th-sec-h{display:flex;gap:11px;align-items:center;background:none;border:0;padding:2px;cursor:pointer;text-align:left;color:var(--ink);border-radius:12px}
.th-sec-h b{display:block;font:800 20px/1.1 var(--display);letter-spacing:-.01em}
.th-sec-h small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.th-sec-h:hover b{color:var(--tc)}
.th-chip{width:42px;height:42px;border-radius:13px;background:var(--tc);display:grid;place-items:center;color:#fff;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.th-chip svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.th-stat{margin:0;font-size:13px;color:var(--muted);padding:0 2px}
.th-stat b{color:var(--ink);font-weight:700}
.th-apps{display:flex;flex-direction:column;gap:1px}
.th-apps button{display:flex;align-items:center;gap:9px;background:none;border:0;border-radius:10px;padding:7px 8px;cursor:pointer;color:var(--ink);font:500 14px var(--body);text-align:left;min-width:0}
.th-apps button:hover,.th-apps button:focus-visible{background:var(--surface2)}
.th-apps .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--tc,var(--blue));background:color-mix(in srgb,var(--tc,var(--blue)) 18%,transparent);flex:none}
.th-apps .ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.th-apps .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th-apps .cnt{font-size:11.5px;color:var(--muted);background:var(--surface2);border-radius:999px;padding:0 7px;font-variant-numeric:tabular-nums}
.th-apps-big{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.th-apps-big button{flex-direction:column;align-items:flex-start;gap:6px;border:1px solid var(--line);padding:12px}
.th-apps-big .n{font-weight:700}
.th-apps-big .d{font-size:12.5px;color:var(--muted);white-space:normal;line-height:1.35}

.th-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px;align-items:start}
.th-do .rows{border-top:0}
.th-do-r{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line2);padding:9px 6px;cursor:pointer;color:var(--ink);font:inherit;border-radius:8px}
.th-do-r:first-child{border-top:0}
.th-do-r:hover,.th-do-r:focus-visible{background:var(--surface2)}
.th-do-r .txt{display:flex;flex-direction:column;min-width:0}
.th-do-r .n{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th-do-r .d{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th-do-r .r{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.kind{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:3px 7px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.k-task{background:var(--blue-soft);color:var(--blue)}
.k-report{background:var(--orange-soft);color:var(--orange)}
.k-follow{background:var(--green-soft);color:var(--green)}
.k-ready{background:var(--gold-soft);color:var(--gold)}
.k-proposal{background:var(--surface2);color:var(--ink)}
.th-week .week{margin-top:2px}

.th-tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.th-tool{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;color:var(--ink);text-align:left;font:inherit;min-width:0;--tc:var(--t-gold)}
.th-tool:hover,.th-tool:focus-visible{border-color:var(--tc)}
.th-tool .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--tc);color:#fff;flex:none}
.th-tool .ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.th-tool b{display:block;font:700 15px var(--body)}
.th-tool small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.th-tool .go{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--blue);white-space:nowrap}
.th .cmty{margin-top:0}
.th-note{font-size:13px;color:var(--muted);margin:0}

/* the bottom of Home */
.th-foot{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;border-top:1px solid var(--line);padding:18px 2px 4px;margin-top:10px}
.th-foot h3{font:700 11px var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 8px}
.th-foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.th-foot a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.th-foot a:hover{color:var(--blue);border-bottom-color:var(--blue)}

/* sections as headers with icon-style apps under each */
.th-secs2{display:flex;flex-direction:column;gap:34px;padding:10px 0 6px}
.th-sec2-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
.th-sec2-h h2{font:800 24px/1.1 var(--display);letter-spacing:-.015em}
.th-sec2-h p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.th-sec2-h .th-stat{font-size:13px;color:var(--muted);padding:0}
.th-icons{display:flex;flex-wrap:wrap;gap:18px 22px;padding:16px 6px 2px}
.th-icons .tile{width:104px}
.th-icons .tile .face{width:84px;height:84px;border-radius:22px}
.th-icons .tile .face svg{width:36px;height:36px}
.th-icons .tile .lbl{display:flex;flex-direction:column;align-items:center;gap:2px}
.th-icons .tile .lbl small{font-size:11px;color:var(--muted);font-weight:600}
.th-icons .tile:hover{color:var(--ink)}
.tw-dot{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--muted);border:2px solid var(--surface)}
.tw-dot.on{background:var(--lead-green)}
.ask-people button{position:relative;padding-left:22px}
.ask-people .tw-dot{left:7px;right:auto;top:11px;bottom:auto;width:9px;height:9px;border-width:1px}
.ask-panel.min{height:auto}
.ask-panel.min>*:not(.ask-h){display:none}
.ask-panel.min .ask-h{cursor:pointer}

/* ---------- Who's who: the team by level ---------- */
.tw-lv{margin-top:12px}
.tw-lv h3{display:flex;align-items:center;gap:8px;font:700 12px var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 8px}
.tw-lv h3 i{width:10px;height:10px;border-radius:3px;background:var(--tc)}
.tw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.tw-p{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:12px;padding:9px 11px;min-width:0}
.tw-p.pending{opacity:.72;border-left-style:dashed}
.tw-av{position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 22%,transparent);color:var(--ink);font:800 12px var(--display);flex:none}
.tw-p b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tw-p small{display:block;font-size:12px;color:var(--muted)}
.tw-p button{margin-left:auto}

/* ---------- Settings for everyone ---------- */
.ts-you{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ts-lv{display:inline-flex;align-items:center;gap:8px;font:800 22px var(--display);letter-spacing:-.01em}
.ts-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.ts-row select{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;min-width:200px}
.ts-cents{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 12px;margin-top:8px;font-size:14px}
.ts-cents label{display:flex;gap:8px;align-items:center;cursor:pointer}
.ts-cents input{width:16px;height:16px;accent-color:var(--lead-blue)}
.ts-seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ts-seg button{background:var(--surface);border:0;padding:8px 16px;cursor:pointer;font-weight:600;color:var(--muted)}
.ts-seg button[aria-pressed="true"]{background:var(--lead-blue);color:#fff}

/* ---------- Calendar: center switch and the locked codes ---------- */
.cs-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 12px}
.cs-bar select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px}
.cs-lock{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--lead-gold) 40%,transparent);margin-bottom:12px}
.cs-lock b{font-size:14px}
.cs-gate label.ck{display:flex;gap:9px;align-items:flex-start;margin:12px 0 4px;font-size:14px;cursor:pointer;line-height:1.35}
.cs-gate label.ck input{width:17px;height:17px;margin-top:1px;accent-color:var(--lead-blue);flex:none}
.cs-gate input[type=password]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:15px}
.cs-err{color:var(--red);font-size:13px;margin-top:8px;min-height:18px}

/* ---------- the project board (pop-up) ---------- */
.pm-modal .pm-sheet{max-width:min(1320px,calc(100vw - 24px));width:100%;max-height:calc(100vh - 32px);display:flex;flex-direction:column;gap:12px;overflow:hidden;padding:16px}
.pm-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pm-head h2{font-size:22px}
.pm-head .meta{font-size:12.5px;color:var(--muted)}
.pm-board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:10px;overflow:auto;min-height:0;flex:1 1 auto;padding-bottom:4px}
.pm-col{background:var(--surface2);border:1px solid var(--line2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px;min-width:0}
.pm-col.over{outline:2px dashed var(--lead-blue);outline-offset:-4px}
.pm-col h3{display:flex;justify-content:space-between;align-items:center;font:700 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:2px 2px 0}
.pm-col h3 span{background:var(--surface);border-radius:999px;padding:1px 8px;color:var(--ink)}
.pm-cards{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:40px}
.pm-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 11px 8px;cursor:grab;display:flex;flex-direction:column;gap:6px;outline:0}
.pm-card:hover,.pm-card:focus-visible{border-color:var(--blue)}
.pm-card.dragging{opacity:.45}
.pm-card.focus{border-color:var(--lead-gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--lead-gold) 30%,transparent)}
.pm-card.late{border-left:4px solid var(--red)}
.pm-card .t{font-weight:600;font-size:14px;line-height:1.3}
.pm-card .m{display:flex;flex-wrap:wrap;gap:4px}
.pm-card .m span{font-size:11.5px;color:var(--muted);background:var(--surface2);border-radius:999px;padding:1px 8px}
.pm-card .m .hi{color:var(--orange);background:var(--orange-soft)}
.pm-card .mv{display:flex;gap:4px;justify-content:space-between}
.pm-card .mv button{background:none;border:1px solid var(--line);border-radius:8px;padding:2px 9px;cursor:pointer;color:var(--muted);font-size:13px}
.pm-card .mv button:hover:not(:disabled){color:var(--ink);border-color:var(--blue)}
.pm-card .mv button:disabled{opacity:.35;cursor:default}
.pm-empty{color:var(--muted);font-size:13px;text-align:center;padding:14px 0;margin:0}
.pm-also{border-top:1px solid var(--line);padding-top:10px;max-height:26vh;overflow:auto}
.pm-also h3{font:700 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.pm-o{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 4px;border-top:1px solid var(--line2);font-size:13.5px}
.pm-o:first-child{border-top:0}
.pm-o .n{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pm-o>span:not(.kind):not(.n):not(.sp){font-size:12px;color:var(--muted)}

/* ---------- feedback ---------- */
.fb-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:6px}
.fb-pick button{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;color:var(--ink);font:inherit}
.fb-pick button:hover,.fb-pick button:focus-visible{border-color:var(--lead-blue)}
.fb-pick b{font:800 18px var(--display)}
.fb-pick small{font-size:13px;color:var(--muted);line-height:1.4}
.fb-form{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.fb-q{display:flex;flex-direction:column;gap:7px}
.fb-q>label,.fb-q>.lq{font-weight:600;font-size:14px}
.fb-q .hint{font-size:12px;color:var(--muted);font-weight:400}
.fb-q input[type=text],.fb-q textarea{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:14px}
.fb-q textarea{min-height:70px;resize:vertical}
.fb-opts{display:flex;flex-wrap:wrap;gap:6px}
.fb-opts label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px;background:var(--surface)}
.fb-opts input{accent-color:var(--lead-blue)}
.fb-opts label:has(input:checked){border-color:var(--lead-blue);background:var(--blue-soft)}
.fb-scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.fb-scale label{justify-content:center}
.fb-ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.fb-r{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;background:var(--surface)}
.fb-r summary{cursor:pointer;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.fb-r dl{margin:10px 0 0;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.fb-r dt{font-size:12px;color:var(--muted)}
.fb-r dd{margin:0 0 4px;font-size:14px;white-space:pre-wrap}
.fb-avg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:6px 0 2px}
.fb-avg b{color:var(--ink)}

/* ---------- the assistant in the corner ---------- */
.ask-btn{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:45;display:flex;align-items:center;gap:8px;background:var(--lead-blue);color:#fff;border:0;border-radius:999px;padding:11px 17px 11px 13px;font:700 14px var(--body);box-shadow:0 10px 30px rgba(5,12,40,.45);cursor:pointer}
.ask-btn:hover{filter:brightness(1.08)}
.ask-btn svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ask-n{position:absolute;top:-5px;right:-3px;min-width:21px;height:21px;border-radius:999px;background:var(--lead-orange);color:#fff;font:800 11px/21px var(--body);font-style:normal;text-align:center;padding:0 6px;box-shadow:0 0 0 2px var(--bg)}
.ask-on .ask-btn{display:none}
.ask-panel{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:46;width:min(410px,calc(100vw - 24px));height:min(620px,calc(100vh - 90px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.ask-panel[hidden]{display:none}
.ask-h{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-bottom:1px solid var(--line);background:var(--surface2)}
.ask-h>b{font:800 15px var(--display);white-space:nowrap}
.ask-tabs{display:flex;gap:2px;margin-left:auto}
.ask-tabs button{background:none;border:0;border-radius:8px;padding:5px 7px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.ask-tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.ask-tabs i{font-style:normal;background:var(--lead-orange);color:#fff;border-radius:999px;padding:0 6px;font-size:11px}
.ask-x{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:8px}
.ask-x:hover{background:var(--surface)}
.ask-log{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.ask-m{max-width:90%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.42;overflow-wrap:anywhere}
.ask-m.bot{background:var(--surface2);align-self:flex-start;border-bottom-left-radius:4px}
.ask-m.me{background:var(--lead-blue);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.ask-m ul{margin:6px 0 0;padding-left:18px}
.ask-m li{margin:3px 0}
.ask-people{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ask-people button{display:flex;flex-direction:column;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;color:var(--ink);font:600 13px var(--body);text-align:left}
.ask-people button:hover{border-color:var(--lead-blue)}
.ask-people small{font-weight:400;color:var(--muted);font-size:11.5px}
.ask-quick{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-top:1px solid var(--line2);scrollbar-width:thin}
.ask-quick button{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap}
.ask-quick button:hover{border-color:var(--lead-blue)}
.ask-f{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.ask-f input{flex:1;min-width:0;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:14px}
.ask-f input:focus{outline:0;border-color:var(--lead-blue)}
.ask-to{margin:-4px 12px 10px;font-size:12.5px;color:var(--muted)}
.ask-msg{border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px}
.ask-msg.in.new{border-color:var(--lead-orange)}
.ask-msg.out{background:var(--surface2)}
.ask-msg .w{font-size:12px;color:var(--muted);margin-bottom:3px}
.ask-msg .t{white-space:pre-wrap;overflow-wrap:anywhere}
.ask-msg.act{border-color:var(--line2);padding:7px 10px}
.ask-msg.act .w{display:flex;align-items:center;gap:7px;margin-bottom:2px}
.ask-msg.act .w b{color:var(--ink)}
.act-av{width:22px;height:22px;font-size:9px}
.act-av .tw-dot{width:9px;height:9px;border-width:1px}

/* ---------- smaller screens ---------- */
@media (max-width:1240px){
  .th-secs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .th-foot{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:900px){
  .th-two{grid-template-columns:1fr}
  .pm-board{grid-template-columns:repeat(4,minmax(220px,78vw))}
}
@media (max-width:860px){
  :root{--pad:max(14px,env(safe-area-inset-left,0px));--padr:max(14px,env(safe-area-inset-right,0px))}
  .brand-logo{height:28px}
  .status{padding:5px 8px}
  .th-tabs button{font-size:16px;padding:6px 9px 8px}
}
@media (max-width:600px){
  .th-secs{grid-template-columns:1fr}
  .th-icons{gap:14px 10px;padding:12px 0 0;justify-content:space-between}
  .th-icons .tile{width:76px}
  .th-icons .tile .face{width:66px;height:66px;border-radius:18px}
  .th-icons .tile .face svg{width:30px;height:30px}
  .th-ms{grid-template-columns:repeat(2,minmax(0,1fr))}
  .th-m b{font-size:23px}
  .th-foot{grid-template-columns:1fr 1fr}
  .ask-btn span{display:none}
  .ask-btn{padding:13px}
  .ask-panel{left:8px;right:8px;bottom:8px;width:auto;height:min(80vh,620px)}
  .pm-modal{padding:8px}
  .pm-modal .pm-sheet{max-height:calc(100vh - 16px);padding:12px}
}
@media (max-width:480px){
  /* inside an app on a phone, the page name gets its own line under the buttons */
  :root[data-mode="app"] .crumb{flex:1 1 100%;order:4;margin-top:-2px}
  :root[data-mode="app"] .crumb .eyebrow{display:none}
  :root[data-mode="app"] .crumb h1{font-size:19px}
  :root[data-mode="app"] .crumb-ic{width:26px;height:26px;border-radius:8px}
  :root[data-mode="app"] .crumb-ic svg{width:15px;height:15px}
  :root[data-mode="app"] .topbar .sp{display:block;order:1;flex:1}
}
@media print{.ask-btn,.ask-panel{display:none!important}}
</style>
