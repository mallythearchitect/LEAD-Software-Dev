<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>LEAD</title>
<meta name="theme-color" content="#193069">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Design plan
   Subject: the operations desk for one organizer's LEAD role in East Hartford, used on a phone between doors and on a laptop at the center.
   Color: LEAD's own logo colors do the work. Navy chrome (--navy), LEAD blue for the active thing (--blue), LEAD orange only for "needs you" (--orange), green for Champions (--green), LEAD sand for anything still a guess (--sand). Content sits on a cool white.
   Type: Bricolage Grotesque for the few big things (page names, the road numbers); Instrument Sans for everything you read and operate.
   Layout: navy rail on the left, content left-aligned in one column up to 1120px. No card kit: rows and hairlines, one drawer object for detail. The signature road is the one bold element.
*/
:root{
  --navy:#15213a; --navy2:#1c2b4a; --chrome-fg:#c9d4ea; --chrome-dim:#8a98b8;
  --bg:#f6f7fb; --surface:#ffffff; --surface2:#eef1f7; --line:#dfe4ee; --line2:#ecf0f6; --ink:#15213a; --muted:#5d6b85;
  --blue:#2f6fe0; --blue-soft:#e3ecfc; --orange:#e8870f; --orange-soft:#fdeedb; --green:#2f9e44; --green-soft:#e1f3e4; --red:#c23b3b; --red-soft:#f9e3e3;
  --sand:#f3e8d2; --sand-ink:#6b4e16; --sand-line:#e3d2ad;
  --notyet:#8b97ab; --talked:#2f6fe0; --supports:#e8870f; --champion:#2f9e44; --declined:#c23b3b;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif; --body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --r:8px; --shadow:0 12px 40px rgba(21,33,58,.18);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --navy:#0c1222; --navy2:#121a30; --chrome-fg:#c9d4ea; --chrome-dim:#7f8dae;
  --bg:#0f1626; --surface:#161f36; --surface2:#1d2742; --line:#2a365a; --line2:#222c4a; --ink:#e6ebf7; --muted:#93a1bf;
  --blue:#6b9cf5; --blue-soft:#1b2c52; --orange:#f0a04a; --orange-soft:#3a2a14; --green:#5ec46f; --green-soft:#17331d; --red:#ef7f7f; --red-soft:#3d1d1d;
  --sand:#2e2a1f; --sand-ink:#e5cf9c; --sand-line:#4a4230;
  --notyet:#8b97ab; --talked:#6b9cf5; --supports:#f0a04a; --champion:#5ec46f; --declined:#ef7f7f;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --navy:#0c1222; --navy2:#121a30; --chrome-fg:#c9d4ea; --chrome-dim:#7f8dae;
  --bg:#0f1626; --surface:#161f36; --surface2:#1d2742; --line:#2a365a; --line2:#222c4a; --ink:#e6ebf7; --muted:#93a1bf;
  --blue:#6b9cf5; --blue-soft:#1b2c52; --orange:#f0a04a; --orange-soft:#3a2a14; --green:#5ec46f; --green-soft:#17331d; --red:#ef7f7f; --red-soft:#3d1d1d;
  --sand:#2e2a1f; --sand-ink:#e5cf9c; --sand-line:#4a4230;
  --notyet:#8b97ab; --talked:#6b9cf5; --supports:#f0a04a; --champion:#5ec46f; --declined:#ef7f7f;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1.05}
h2{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:-.01em}
h3{font-family:var(--body);font-weight:600;font-size:14px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100%;background:var(--navy)}
.main{background:var(--bg);min-height:100vh}
.rail{background:var(--navy);color:var(--chrome-fg);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:0 0 12px;padding-top:env(safe-area-inset-top,0px)}
.rail .brand{padding:22px 20px 18px;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;color:#fff;line-height:1.1}
.rail .brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--chrome-dim);margin-top:4px;letter-spacing:0}
.rail .grp{padding:10px 20px 4px;font-size:11px;color:var(--chrome-dim);font-weight:600}
.rail button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:8px 17px;cursor:pointer;color:var(--chrome-fg);font-size:14px}
.rail button:hover{background:var(--navy2)}
.rail button[aria-current="page"]{border-left-color:#3c78e2;background:var(--navy2);color:#fff;font-weight:600}
.rail button .cnt{margin-left:auto;font-size:12px;color:var(--chrome-dim);font-variant-numeric:tabular-nums}
.rail .foot{margin-top:auto;padding:12px 20px 0;font-size:12px;color:var(--chrome-dim);display:flex;align-items:center;gap:7px}
.rail .foot i{width:8px;height:8px;border-radius:50%;background:var(--chrome-dim);flex:none}
.rail .foot i.on{background:#3db73d}.rail .foot i.off{background:#fa7506}
.main{min-width:0;background:var(--bg)}
.bar{display:flex;align-items:center;gap:12px;padding:18px 28px 0;flex-wrap:wrap}
.bar h1{flex:1;min-width:140px}
.bar .search{position:relative;flex:0 1 300px;min-width:160px}
.bar .search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 36px;font-size:14px}
.bar .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.bar .results{position:absolute;top:42px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);z-index:30;max-height:360px;overflow:auto}
.bar .results button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line2);padding:9px 12px;cursor:pointer}
.bar .results button:first-child{border-top:0}
.bar .results button:hover{background:var(--surface2)}
.bar .results .k{font-size:12px;color:var(--muted)}
.content{padding:16px 28px 48px;max-width:1120px}
.tabs{display:none}

/* ---------- common pieces ---------- */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--red);border-color:var(--red-soft);background:var(--red-soft)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.toolrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 10px}
.toolrow select,.toolrow input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;font-size:13px;max-width:100%}
.toolrow .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.5}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.st-Prospect{color:var(--notyet)}.st-Contacted{color:var(--talked)}.st-Supporter{color:var(--supports)}.st-Champion{color:var(--champion)}.st-Declined{color:var(--declined)}
.pill.sand{background:var(--sand);color:var(--sand-ink)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.orange{background:var(--orange-soft);color:var(--orange)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.grey{background:var(--surface2);color:var(--muted)}
.pri-High{color:var(--orange);font-weight:600}.pri-Medium{color:var(--muted)}.pri-Low{color:var(--muted);opacity:.7}

.sec{margin-top:26px}
.sec>.h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.sec>.h h2{flex:1}
.sec>.h .meta{font-size:13px;color:var(--muted)}
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:10px 0;border-bottom:1px solid var(--line2);align-items:center;cursor:pointer;min-width:0}
.row:hover{background:var(--surface2);box-shadow:0 0 0 8px var(--surface2)}
.row .n{font-weight:600}
.row .d{font-size:13px;color:var(--muted);grid-column:1}
.row .r{font-size:13px;color:var(--muted);text-align:right;align-self:center;white-space:nowrap}
.row .r.wrap{white-space:normal;overflow-wrap:anywhere;max-width:170px}
.row.static{cursor:default}
.row.static:hover{background:none;box-shadow:none}
.empty{color:var(--muted);padding:12px 0;font-size:14px}
.note{background:var(--sand);color:var(--sand-ink);border:1px solid var(--sand-line);border-radius:var(--r);padding:10px 14px;font-size:14px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}

/* ---------- today ---------- */
.road{background:var(--navy);color:#fff;border-radius:12px;padding:18px 22px 16px;margin-top:4px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 28px;align-items:end}
.road .big{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.02em}
.road .big small{font-size:18px;font-weight:600;color:var(--chrome-dim);letter-spacing:0;margin-left:4px}
.road .lbl{font-size:13px;color:var(--chrome-dim);margin-top:2px}
.road .days{text-align:right}
.road .days .big{font-size:34px}
.road .track{grid-column:1/-1;position:relative;height:6px;background:rgba(255,255,255,.22);border-radius:3px;margin:12px 0 24px}
.road .track .fill{position:absolute;left:0;top:0;bottom:0;background:#3db73d;border-radius:3px}
.road .track .pin{position:absolute;top:50%;width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid #3db73d;transform:translate(-50%,-50%);box-sizing:border-box}
.road .track .tick{position:absolute;top:-6px;width:1px;height:18px;background:rgba(255,255,255,.45)}
.road .track .tick em{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;color:rgba(255,255,255,.65);white-space:nowrap}
.road .track .tick.end em{transform:translateX(-100%)}
.road .src{grid-column:1/-1;display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--chrome-dim)}
.road .src b{color:#fff;font-weight:600}
.road button{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.road button:hover{background:rgba(255,255,255,.08)}
.pipe{display:flex;gap:0;border-radius:6px;overflow:hidden;height:14px;margin:8px 0 8px}
.pipe i{display:block;height:100%}
.pipe-key{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.pipe-key button{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.pipe-key button i{width:9px;height:9px;border-radius:2px;display:inline-block}
.pipe-key b{font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:6px}
.week .day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;min-height:92px;min-width:0}
.week .day.today{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.week .day .d{font-size:12px;color:var(--muted);margin-bottom:6px}.week .day .d b{color:var(--ink);font-size:15px;margin-right:4px;font-family:var(--display)}
.week .ev{font-size:12px;line-height:1.3;padding:4px 6px;border-radius:5px;background:var(--surface2);margin-top:4px;cursor:pointer;overflow:hidden}
.week .ev.table{background:var(--green-soft)}
.week .ev .t{color:var(--muted);font-size:11px}
.week .ev.more{background:none;border:1px dashed var(--line);color:var(--blue);width:100%;text-align:left}
.do .row{grid-template-columns:auto minmax(0,1fr) auto}
.do .row .ck{width:18px;height:18px;border:2px solid var(--line);border-radius:5px;cursor:pointer;background:var(--surface);flex:none}
.do .row .ck.on{background:var(--green);border-color:var(--green)}
.do .row.done .n{text-decoration:line-through;opacity:.5}

.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.strip div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0;cursor:pointer}
.strip div:hover{border-color:var(--blue)}
.strip b{font-family:var(--display);font-size:22px;font-weight:800;display:block;line-height:1.1}
.strip span{font-size:12px;color:var(--muted)}
.strip .warnv b{color:var(--orange)}.strip .okv b{color:var(--green)}
.assess .q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line2);font-size:14px}
.assess .q .opts{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.assess .q .opts button{background:var(--surface);border:0;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--muted);min-width:34px}
.assess .q .opts button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.assess .q small{display:block;color:var(--muted);font-size:12px}
.verdict{margin-top:12px;padding:12px 14px;border-radius:var(--r);background:var(--surface2);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center}
.verdict .big{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.verdict.go{background:var(--green-soft);color:var(--green)}.verdict.fit{background:var(--blue-soft);color:var(--blue)}.verdict.skip{background:var(--red-soft);color:var(--red)}.verdict.hold{background:var(--orange-soft);color:var(--orange)}
.verdict .big+div{font-size:13px}
.ck2{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.ck2 label{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.ck2 input{width:16px;height:16px;accent-color:var(--blue)}
.mtg{padding:14px 0;border-bottom:1px solid var(--line2)}
.mtg .n{font-weight:600;font-size:16px;cursor:pointer}
.mtg .s{font-size:13px;color:var(--muted)}
.mtg .notes{white-space:pre-wrap;font-size:14px;margin-top:8px}
.mtg ul{margin:6px 0 0;padding-left:0;list-style:none}
.mtg li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;padding:5px 0;border-top:1px solid var(--line2);font-size:14px}
.mtg li .acts{display:flex;gap:4px}
.mtg h4{margin:12px 0 0;font-size:13px;color:var(--muted);font-weight:600}
@media (max-width:900px){.strip{grid-template-columns:1fr 1fr 1fr;gap:6px}.strip div{padding:8px}.strip b{font-size:18px}}

/* ---------- lists / tables ---------- */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px 8px 6px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
th.on{color:var(--ink)}
td{padding:9px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--surface2)}
td .n{font-weight:600}td .s{font-size:12px;color:var(--muted)}
.tablewrap{overflow-x:auto;margin:0 -4px}
.cards{display:flex;flex-direction:column}
.card{padding:12px 0;border-bottom:1px solid var(--line2);cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}
.card:hover{background:var(--surface2)}
.card .n{font-weight:600;grid-column:1}.card .s{font-size:13px;color:var(--muted);grid-column:1}.card .r{grid-column:2;grid-row:1/span 3;align-self:start;text-align:right;white-space:nowrap}
.wk{margin-top:18px}
.wk h3{margin-bottom:4px}

/* ---------- map ---------- */
.mapwrap{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:24px;align-items:start}
.schem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;min-width:0}
.schem svg{width:100%;height:auto;display:block}
.schem .town{cursor:pointer}
.schem .town circle{fill:var(--blue-soft);stroke:var(--blue);stroke-width:1.5}
.schem .town.on circle{fill:var(--blue);stroke:var(--navy)}
.schem .town text{font-family:var(--body);font-size:11px;fill:var(--ink);pointer-events:none}
.schem .town .c{font-family:var(--display);font-weight:800;font-size:14px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.schem .town.on .c{fill:#fff}
.schem .river{fill:none;stroke:var(--talked);stroke-opacity:.35;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.schem .rlbl{font-size:10px;fill:var(--muted);font-style:italic}

#lmap{height:min(72vh,720px);min-height:380px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);z-index:0}
.leaflet-container{font-family:var(--body)}
.leaflet-tooltip{font-family:var(--body);font-size:12px}
.evpin i{display:block;width:12px;height:12px;background:var(--talked);border:2px solid #fff;transform:rotate(45deg);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.mapkey{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;align-items:center}
.mapkey i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.mapkey i.hollow{background:transparent!important;border:2px solid var(--notyet);width:8px;height:8px}
.mapkey i.ev{border-radius:0;transform:rotate(45deg);background:var(--talked);width:8px;height:8px}

.picker{position:relative}
.picker .pl{position:absolute;left:0;right:0;top:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);z-index:5;max-height:220px;overflow:auto}
.picker .pl button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line2);padding:7px 10px;cursor:pointer;font-size:13px}
.picker .pl button:first-child{border-top:0}.picker .pl button:hover{background:var(--surface2)}
.rep-list label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line2);cursor:pointer;font-size:14px}
.rep-list label:first-child{border-top:0}
.rep-list input{margin-top:3px;accent-color:var(--blue)}
.rep-list .s{font-size:12px;color:var(--muted)}

.tviews{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.tviews button{background:var(--surface);border:0;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--muted)}
.tviews button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.capture{display:flex;gap:8px;margin:10px 0 14px}
.capture input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:15px}
.capture select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:13px}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line2);border-radius:8px;cursor:pointer}
.trow:hover{background:var(--surface2)}
.trow .ck{width:18px;height:18px;border:2px solid var(--line);border-radius:50%;background:var(--surface);cursor:pointer;flex:none}
.trow .ck.on{background:var(--green);border-color:var(--green)}
.trow.done .n{text-decoration:line-through;opacity:.5}
.trow .n{font-weight:500}.trow .d{font-size:12px;color:var(--muted)}
.trow .r{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.trow .r.over{color:var(--red);font-weight:600}.trow .r.soon{color:var(--orange);font-weight:600}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.col{background:var(--surface2);border-radius:12px;padding:10px;min-height:120px}
.col h3{display:flex;justify-content:space-between;margin:0 4px 8px}
.col.over{outline:2px dashed var(--blue)}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:8px;cursor:grab;font-size:14px}
.tcard .d{font-size:12px;color:var(--muted);margin-top:3px}
.tcard .sec{font-size:11px;color:var(--blue);font-weight:600;margin-top:0}
.tcard.dragging{opacity:.4}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11px;color:var(--muted);font-weight:600;text-align:center;padding:4px 0}
.cal .cell{background:var(--surface);border:1px solid var(--line);border-radius:9px;min-height:108px;padding:5px;min-width:0}
.cal .cell.out{opacity:.45}.cal .cell.today{box-shadow:inset 0 0 0 2px var(--blue)}
.cal .cell .dn{font-family:var(--display);font-weight:800;font-size:13px;margin-bottom:3px}
.cal .ev,.cal .tk{font-size:11px;line-height:1.25;padding:2px 5px;border-radius:5px;margin-top:3px;cursor:pointer;overflow:hidden;display:block;text-align:left;width:100%;border:0;font-family:inherit}
.cal .ev{background:var(--blue-soft);color:var(--blue)}.cal .ev.go{background:var(--green-soft);color:var(--green)}
.cal .tk{background:var(--surface2);color:var(--ink)}.cal .tk.done{text-decoration:line-through;opacity:.5}.cal .tk.over{background:var(--red-soft);color:var(--red)}
.cal .more{font-size:11px;color:var(--muted);padding:2px 5px}
.calnav{display:flex;align-items:center;gap:8px;margin:8px 0}
.calnav h2{flex:1}
.lnk{font-size:12px;color:var(--blue);text-decoration:none;border:1px solid var(--blue-soft);background:var(--blue-soft);border-radius:999px;padding:1px 8px;white-space:nowrap}
.lnk:hover{background:var(--blue);color:#fff}
.ai{margin-top:10px}
.ai textarea{width:100%;min-height:150px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;line-height:1.45;resize:vertical}
.ai .busy{font-size:13px;color:var(--muted)}
.subs{margin-top:4px}
.subs label{display:flex;gap:8px;align-items:center;font-size:14px;padding:3px 0}
@media (max-width:900px){.board{grid-template-columns:1fr 1fr}.cal .cell{min-height:70px;padding:3px}.cal .ev,.cal .tk{font-size:10px;padding:1px 3px}}
@media (max-width:560px){.board{grid-template-columns:1fr}}

/* ---------- team ---------- */
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.form .f{display:flex;flex-direction:column;gap:3px;min-width:0}
.form label{font-size:12px;color:var(--muted);font-weight:600}
.form input,.form select,.form textarea{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
.form .wide{grid-column:1/-1}
.totals{display:flex;gap:22px;flex-wrap:wrap;margin:12px 0}
.totals div b{font-family:var(--display);font-size:24px;font-weight:800;display:block;line-height:1}
.totals div span{font-size:12px;color:var(--muted)}

/* ---------- playbook ---------- */
.subnav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:8px}
.subnav button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;cursor:pointer;color:var(--muted);font-size:14px;margin-bottom:-1px}
.subnav button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--blue);font-weight:600}
.entry{padding:14px 0;border-bottom:1px solid var(--line2);cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px}
.entry:hover{background:var(--surface2)}
.entry .t{font-weight:600;font-size:15px}
.entry .b{white-space:pre-wrap;font-size:14px;grid-column:1/-1;color:var(--ink)}
.entry .m{font-size:12px;color:var(--muted);grid-column:1/-1}
.entry.guess .b{background:var(--sand);color:var(--sand-ink);border:1px solid var(--sand-line);border-radius:6px;padding:8px 10px}
.entry.unknown .b{border-left:3px solid var(--red);padding-left:10px}
.facts h3{font-family:var(--display);font-size:16px;color:var(--ink);font-weight:600;margin:20px 0 6px}
.facts ul{margin:0;padding-left:18px}
.facts li{margin:5px 0;font-size:14px}
.facts a{word-break:break-all;font-size:13px}
.meet{padding:12px 0;border-bottom:1px solid var(--line2)}
.meet .n{font-weight:600}.meet .s{font-size:13px;color:var(--muted);margin-top:2px}
.meet .dates{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.meet .dates span{font-size:12px;background:var(--surface2);border-radius:5px;padding:2px 7px;font-variant-numeric:tabular-nums}
.meet .dates span.next{background:var(--blue-soft);color:var(--blue);font-weight:600}

/* ---------- log ---------- */
.quick{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start}
.quick textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;resize:vertical;min-height:46px;width:100%}
.quick .side{display:flex;flex-direction:column;gap:6px}
.quick select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px}
.lg{padding:10px 0;border-bottom:1px solid var(--line2);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;cursor:pointer}
.lg:hover{background:var(--surface2)}
.lg .acts{grid-column:1/-1;display:flex;gap:6px}

/* ---------- drawer & modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,16,30,.5);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:41;overflow:auto;padding:18px 22px calc(28px + env(safe-area-inset-bottom,0px));padding-top:calc(18px + env(safe-area-inset-top,0px));box-shadow:var(--shadow)}
.drawer .top{display:flex;gap:10px;align-items:flex-start}
.drawer .top h2{flex:1;font-size:22px}
.drawer .x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted);line-height:1;padding:2px 6px}
.drawer .kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:14px;margin:14px 0}
.drawer .kv div:nth-child(odd){color:var(--muted);font-size:13px}
.drawer .kv a{word-break:break-all}
.drawer .edit{border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.drawer .edit h3{margin-bottom:8px}
.stpick{display:flex;gap:6px;flex-wrap:wrap}
.stpick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.stpick button i{width:8px;height:8px;border-radius:50%;display:inline-block}
.stpick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.yn{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:10px;font-size:14px}
.yn .opts{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.yn .opts button{background:var(--surface);border:0;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.yn .opts button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sig{display:flex;align-items:center;gap:8px;margin-top:12px}
.sig .v{font-family:var(--display);font-weight:800;font-size:28px;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.sig button{width:38px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;font-weight:600}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fields .f{display:flex;flex-direction:column;gap:3px;min-width:0}
.fields .f.wide{grid-column:1/-1}
.fields label{font-size:12px;color:var(--muted);font-weight:600}
.fields input,.fields select,.fields textarea{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
.fields textarea{min-height:70px;resize:vertical}
.drawer .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(10,16,30,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal .sheet{background:var(--surface);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.modal{align-items:center;padding:20px}.modal .sheet{border-radius:12px;padding-bottom:18px}}
.sheet h2{margin-bottom:12px}
.sheet .btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:60;box-shadow:var(--shadow)}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.links a,.links span.nolink{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink);background:var(--surface)}
.links a:hover{border-color:var(--blue)}
.links .n{font-weight:600}.links .d{font-size:13px;color:var(--muted)}
.links span.nolink{color:var(--muted)}
.org-links{margin-top:3px}.org-links a{font-weight:600;text-decoration:none}.org-links a:hover{text-decoration:underline}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .bar{padding:14px 16px 0}
  .content{padding:12px 16px calc(100px + env(safe-area-inset-bottom,0px))}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--navy);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:35}
  .tabs button{flex:1;background:none;border:0;padding:6px 2px;font-size:11px;color:var(--chrome-dim);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
  .tabs button[aria-current="page"]{color:#fff;font-weight:600}
  .tabs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .two,.three,.mapwrap,.links{grid-template-columns:1fr}
  .form{grid-template-columns:1fr 1fr}
  .week{grid-template-columns:1fr;gap:6px}
  .week .day{min-height:0;display:grid;grid-template-columns:52px minmax(0,1fr);gap:0 8px;align-items:start}
  .week .day .d{margin:0;display:flex;flex-direction:column;line-height:1.1}.week .day .d b{font-size:18px}
  .week .day>.ev,.week .day>.muted{grid-column:2}
  .week .ev{margin-top:0;margin-bottom:4px}
  .bar h1{flex:1 0 100%}
  .bar .search{flex:1 1 0;min-width:0}
  .road{padding:14px 16px 12px;grid-template-columns:1fr auto}
  .road .big{font-size:36px}.road .days .big{font-size:26px}
  h1{font-size:26px}
  .fields{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}}
/* ---------- 2026 desk refresh: layered on top of the existing application ---------- */
:root{--aqua:#35d0ba;--aqua-soft:#daf8f2;--violet:#7968f7;--glow:0 20px 56px rgba(31,48,83,.12);--rail-w:252px}

.rail .brand{position:relative;margin:14px 4px 12px;padding:18px 16px 16px;border:1px solid rgba(255,255,255,.13);border-radius:15px;background:linear-gradient(135deg,rgba(69,119,226,.25),rgba(83,66,171,.14));font-size:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.rail .brand:before{content:"CAMPAIGN DESK";display:block;color:#87a6e9;font-family:var(--body);font-size:10px;font-weight:700;letter-spacing:.13em;margin-bottom:5px}.rail .brand small{color:#b0c1e4;margin-top:5px}.rail .rail-toggle{position:absolute;right:11px;top:12px;width:26px;height:26px;border-radius:8px;border:1px solid rgba(255,255,255,.16);padding:0;display:grid;place-items:center;color:#dbe7ff;background:rgba(7,17,39,.22);font-size:16px;line-height:1}
.rail .grp{padding:14px 12px 5px;font-size:10px;font-weight:700;letter-spacing:.1em;color:#8497bd;text-transform:uppercase}.rail button:not(.rail-toggle){border-left:0;border-radius:9px;padding:9px 11px;margin:1px 0;transition:background .18s ease,transform .18s ease,color .18s ease}.rail button:not(.rail-toggle):hover{background:rgba(255,255,255,.08);transform:translateX(2px)}.rail button[aria-current="page"]{background:linear-gradient(90deg,rgba(61,120,226,.34),rgba(61,120,226,.12));box-shadow:inset 3px 0 #5e9bff;color:#fff}.rail button .cnt{background:rgba(255,255,255,.09);border-radius:999px;padding:1px 6px;color:#c6d5f0}.rail .foot{margin:8px 8px 0;padding:10px 5px 0;border-top:1px solid rgba(255,255,255,.11);font-size:11px}
.main{background:linear-gradient(135deg,#f7f9fd 0%,#edf3ff 52%,#f8f6ff 100%);min-height:100vh}.bar{position:sticky;top:0;z-index:25;margin:0;padding:16px 28px 14px;background:linear-gradient(to bottom,rgba(247,249,253,.93) 0%,rgba(247,249,253,.78) 75%,rgba(247,249,253,0) 100%);backdrop-filter:blur(14px);border-bottom:0}.bar:before{content:"";position:absolute;bottom:0;left:28px;right:28px;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.title-stack{flex:1;min-width:168px}.eyebrow{color:var(--blue);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:0 0 3px}.bar h1{font-size:29px}.bar .search{flex:0 1 330px}.bar .search input{padding:10px 70px 10px 38px;border-radius:11px;border-color:transparent;background:rgba(255,255,255,.78);box-shadow:0 2px 0 rgba(21,33,58,.04),0 7px 20px rgba(29,49,92,.05);transition:box-shadow .18s ease,background .18s ease}.bar .search input:focus{background:var(--surface);box-shadow:0 0 0 3px rgba(47,111,224,.14),0 12px 28px rgba(29,49,92,.10);outline:0}.bar .search:after{content:"⌘ K";position:absolute;right:10px;top:50%;transform:translateY(-50%);border:1px solid var(--line);border-radius:5px;color:var(--muted);font-size:10px;font-weight:700;padding:2px 5px;pointer-events:none}.bar .search svg{left:13px}.bar .btn.pri{border-radius:10px;padding:10px 14px;box-shadow:0 8px 18px rgba(47,111,224,.25);font-weight:700}.theme-toggle{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.74);cursor:pointer;font-size:17px;box-shadow:0 3px 12px rgba(29,49,92,.06)}.theme-toggle:hover{transform:translateY(-1px);background:var(--surface)}
.pulse{display:flex;align-items:center;gap:9px;margin:0 28px 3px;padding:8px 11px;border:1px solid rgba(118,137,178,.18);border-radius:12px;background:rgba(255,255,255,.56);box-shadow:0 4px 16px rgba(33,50,85,.04);font-size:12px;overflow:auto;scrollbar-width:none}.pulse::-webkit-scrollbar{display:none}.pulse .pulse-label{color:var(--muted);font-weight:700;white-space:nowrap;margin-right:3px}.pulse button{border:0;background:transparent;color:var(--ink);font:inherit;white-space:nowrap;cursor:pointer;padding:2px 8px;border-radius:999px}.pulse button:hover{background:var(--blue-soft);color:var(--blue)}.pulse b{font-family:var(--display);font-size:15px;color:var(--blue);margin-right:3px}.pulse .pulse-live{display:inline-flex;align-items:center;gap:5px;color:var(--muted);margin-left:auto;white-space:nowrap}.pulse .pulse-live i{width:7px;height:7px;border-radius:50%;background:var(--aqua);box-shadow:0 0 0 4px rgba(53,208,186,.14)}

/* ---------- views + cultures ---------- */
[hidden]{display:none!important}
:root{--k-B:#a2550a;--k-PR:#1f5fd6;--k-DR:#c42d2d;--k-BR:#1d8a3c;--k-MEX:#0e7a6f;--k-COL:#a87a00;--k-ECO:#7442d6;--k-PER:#b8246a;--lv-family:#2f9e44;--lv-work:#2f6fe0;--lv-adult:#d0700a;--lv-no:#c23b3b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--k-B:#f0a04a;--k-PR:#7aa7ff;--k-DR:#ff8a8a;--k-BR:#6fd38a;--k-MEX:#4fd1c0;--k-COL:#f2c94c;--k-ECO:#b79cff;--k-PER:#ff8fc4;--lv-family:#5ec46f;--lv-work:#7ca7f7;--lv-adult:#f0a04a;--lv-no:#ef7f7f}}
:root[data-theme="dark"]{--k-B:#f0a04a;--k-PR:#7aa7ff;--k-DR:#ff8a8a;--k-BR:#6fd38a;--k-MEX:#4fd1c0;--k-COL:#f2c94c;--k-ECO:#b79cff;--k-PER:#ff8fc4;--lv-family:#5ec46f;--lv-work:#7ca7f7;--lv-adult:#f0a04a;--lv-no:#ef7f7f}

.viewsw{display:flex;flex-direction:column;gap:4px;padding:0 20px 12px}
.viewsw label{font-size:11px;font-weight:600;color:var(--chrome-dim)}
.viewsw select{width:100%;min-width:0;background:var(--navy2);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px 8px;font-size:13px}
.viewsw.light{padding:0 0 12px}
.viewsw.light label{color:var(--muted)}
.viewsw.light select{background:var(--surface);color:var(--ink);border-color:var(--line)}
@media (min-width:901px){:root[data-rail="compact"] .rail .viewsw{display:none}}
.viewnote{margin:0 0 14px}
:root[data-view="exec"] .vh-exec,:root[data-view="canv"] .vh-canv,:root[data-view="coord"] .vh-coord{display:none!important}

.kchip{display:inline-flex;align-items:center;gap:5px;border:1px solid color-mix(in srgb,var(--kc) 38%,transparent);background:color-mix(in srgb,var(--kc) 11%,var(--surface));color:var(--kc);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.6;font-family:inherit}
button.kchip{cursor:pointer}button.kchip:hover{background:color-mix(in srgb,var(--kc) 20%,var(--surface))}
.flagbar{display:flex;flex-direction:column;width:10px;border-radius:3px;overflow:hidden;align-self:stretch;flex:none;min-height:40px}
.flagbar i,.sw i,.cu-banner .band i,.cu-block .bar i{display:block}
.sw{display:inline-flex;flex-direction:column;width:6px;height:14px;border-radius:2px;overflow:hidden;vertical-align:-2px;flex:none}
.cu-links{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:4px}
.sheet .kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 12px;font-size:14px;margin:10px 0 14px}
.sheet .kv>div:nth-child(odd){color:var(--muted);font-size:13px}
.sheet .kv a{word-break:break-all}

.cal .cel,.week .cel{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--kc);background:color-mix(in srgb,var(--kc) 10%,var(--surface));color:var(--ink);font-family:inherit;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-radius:5px}
.cal .cel{font-size:11px;line-height:1.25;padding:2px 5px;margin-top:3px}
.week .cel{font-size:11.5px;line-height:1.3;padding:3px 6px;margin-top:4px}
.cu-strip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 10px;font-size:13px}
.cu-strip .lbl{color:var(--muted);font-size:12px;font-weight:600}
.cu-strip select{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 8px;font-size:13px}
.cu-strip .celx{border:1px solid color-mix(in srgb,var(--kc) 38%,transparent);background:color-mix(in srgb,var(--kc) 9%,var(--surface));color:var(--ink);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;font-family:inherit}

.cu-nav{margin-bottom:4px}
.cu-tools input[type=search]{flex:1 1 320px;max-width:460px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px}
.cu-chk{font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.cu-hits{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:0 0 14px;max-height:420px;overflow:auto;box-shadow:var(--shadow)}
.cu-hits .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.cu-hits button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line2);padding:9px 12px;cursor:pointer;font-family:inherit;color:var(--ink)}
.cu-hits button:hover{background:var(--surface2)}
.cu-hits .where{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;font-weight:600;margin-bottom:3px}
.cu-hits .snip{font-size:13.5px;color:var(--muted)}
.cu-hits mark,mark.hit{background:#ffe27a;color:#1a1a1a;border-radius:2px}
mark.chk{background:var(--sand);color:var(--sand-ink);font-size:.78em;font-weight:600;border-radius:4px;padding:1px 5px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.cu.nochk mark.chk{display:none}
.cu-h2{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.01em;margin:6px 0 4px}
.cu-banner{display:flex;gap:6px;height:54px;margin:4px 0 14px}
.cu-banner .band{flex:1;display:flex;flex-direction:column;border:0;padding:0;border-radius:8px;overflow:hidden;cursor:pointer;transition:transform .15s ease}
.cu-banner .band:hover{transform:translateY(-2px)}
.cu-comms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cu-comm{display:flex;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font-family:inherit;color:var(--ink);min-width:0}
.cu-comm:hover{border-color:var(--kc)}
.cu-comm .txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.cu-comm b{font-family:var(--display);font-size:19px;color:var(--kc);line-height:1.1}
.cu-comm .ppl,.cu-ghead .ppl{font-weight:600;font-size:14px}
.cu-comm .ln{font-size:13px;color:var(--muted)}
.cu-comm .meta{font-size:12px;color:var(--muted);margin-top:3px}
.cu-dates{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.cu-dates span{font-size:11.5px;background:var(--surface2);color:var(--ink);border-radius:999px;padding:1px 8px}
.cu-switch{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 6px}
.cu-switch button,.cu-tog button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--muted);font-family:inherit}
.cu-switch button[aria-pressed="true"]{background:var(--kc);border-color:var(--kc);color:#fff}
.cu-tog{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 12px}
.cu-tog .lbl{font-size:12px;color:var(--muted);font-weight:600;margin-right:2px}
.cu-tog button[aria-pressed="true"]{border-color:var(--kc);color:var(--ink);background:color-mix(in srgb,var(--kc) 12%,var(--surface))}
.cu-tog button[aria-pressed="false"]{opacity:.6}
.cu-tog button.mini{border-style:dashed}
.cu-ghead{display:flex;gap:14px;padding:12px 0 16px;border-bottom:1px solid var(--line)}
.cu-ghead .flagbar{width:14px}
.cu-h{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.02em;color:var(--kc);line-height:1.05}
.cu-ghead p{margin:4px 0;color:var(--muted);font-size:14px}
.cu-body{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;margin-top:16px}
.cu-toc{position:sticky;top:96px;align-self:start;max-height:calc(100vh - 110px);overflow:auto;font-size:13px;display:flex;flex-direction:column}
.cu-toc a{color:var(--muted);text-decoration:none;padding:3px 8px;border-left:2px solid var(--line)}
.cu-toc a.sec{color:var(--ink);font-weight:600;margin-top:6px}
.cu-toc a.sub{padding-left:18px}
.cu-toc a:hover{color:var(--kc);border-left-color:var(--kc)}
.cu-tocsel{display:none}
.cu-read{min-width:0}
.cu-read [id]{scroll-margin-top:100px}
.cu-read section{margin-bottom:26px}
.cu-read h2{font-family:var(--display);font-weight:600;font-size:21px;margin:0 0 10px;padding-top:4px;color:var(--ink)}
.cu-read h3{font-size:15px;color:var(--ink);margin:16px 0 6px}
.cu-prose{font-size:15.5px;line-height:1.62;color:var(--ink);overflow-wrap:break-word}
.cu-prose p{margin:0 0 12px}
.cu-prose ul,.cu-prose ol{padding-left:20px;margin:0 0 14px}
.cu-prose li{margin:0 0 6px}
.cu-prose li::marker{color:var(--kc,var(--muted))}
.cu-prose strong{font-weight:600}
.cu-prose a{overflow-wrap:anywhere}
.cu-prose .tblw{overflow-x:auto;margin:0 0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.cu-prose table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.4}
.cu-prose th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:7px 10px;border-bottom:1px solid var(--line);background:var(--surface2);cursor:default;white-space:normal}
.cu-prose td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
.cu-prose tr:last-child td{border-bottom:0}
.cu-flash{animation:cuflash 1.6s ease}
@keyframes cuflash{0%{background:var(--blue-soft)}100%{background:transparent}}
.cu-pager{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:14px;margin-top:10px}
.cu-tg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:12px 0 8px}
.cu-tg h3{font-size:12px;margin-bottom:6px}
.cu-block{display:grid;grid-template-columns:190px minmax(0,1fr);gap:18px;padding:16px 0;border-top:1px solid var(--line)}
.cu-block .who button{display:flex;flex-direction:column;gap:3px;text-align:left;background:none;border:0;padding:0;cursor:pointer;font-family:inherit;color:var(--ink);position:sticky;top:96px}
.cu-block .who .bar{display:flex;height:6px;width:64px;border-radius:3px;overflow:hidden;margin-bottom:4px}
.cu-block .who .bar i{flex:1}
.cu-block .who b{font-family:var(--display);font-size:17px;color:var(--kc)}
.cu-block .who span:last-child{font-size:12.5px;color:var(--muted)}
.cu-month{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.cu-month h3{font-family:var(--display);font-size:18px;color:var(--ink)}
.cu-month h3 small{display:block;font-family:var(--body);font-size:11px;color:var(--blue);font-weight:600;margin-top:2px}
.cu-ev{display:grid;grid-template-columns:118px minmax(0,auto) minmax(0,1fr);gap:4px 12px;padding:7px 8px;border-left:3px solid var(--kc);border-bottom:1px solid var(--line2);align-items:start;font-size:14px;cursor:pointer}
.cu-ev:hover{background:var(--surface2)}
.cu-ev .when{color:var(--muted);font-size:13px}
.cu-ev .ks{display:flex;flex-wrap:wrap;gap:4px}
.cu-ev .what{font-weight:600}
.cu-ev .note2{font-size:13px;color:var(--muted)}
.lv{display:inline-block;border-radius:999px;padding:0 8px;font-size:12px;font-weight:600;line-height:1.6}
.l-family{background:color-mix(in srgb,var(--lv-family) 15%,transparent);color:var(--lv-family)}
.l-work{background:color-mix(in srgb,var(--lv-work) 15%,transparent);color:var(--lv-work)}
.l-adult{background:color-mix(in srgb,var(--lv-adult) 15%,transparent);color:var(--lv-adult)}
.l-no{background:color-mix(in srgb,var(--lv-no) 15%,transparent);color:var(--lv-no)}
.cu-tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.cu-ptable{width:100%;border-collapse:collapse;font-size:14px}
.cu-ptable th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);cursor:default}
.cu-ptable td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
.cu-ptable .t{font-weight:600}
.toolrow input#cuPq{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;font-size:13px;min-width:200px}
@media (max-width:900px){
  .cu-comms{grid-template-columns:minmax(0,1fr)}
  .cu-body{grid-template-columns:minmax(0,1fr);gap:10px}
  .cu-toc{display:none}
  .cu-tocsel{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;position:sticky;top:0;z-index:5}
  .cu-block,.cu-month{grid-template-columns:minmax(0,1fr);gap:8px}
  .cu-block .who button{position:static}
  .cu-ev{grid-template-columns:minmax(0,1fr)}
  .cu-tg{grid-template-columns:1fr 1fr}
  .cu-banner{height:40px;gap:4px}
  .cu-h{font-size:26px}
  .cu-ghead{flex-direction:column;gap:10px}
  .cu-ghead .flagbar{flex-direction:row;width:100%;height:8px;min-height:0}
  .cu-prose{font-size:15px}
}

/* ---------- proposals + alignment meter ---------- */
.pr-intro{max-width:78ch;margin:2px 0 4px}
.pr-list .row{grid-template-columns:minmax(0,1fr) auto}
.pr-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;white-space:normal}
.pr-mini{--mc:var(--notyet);display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pr-mini .pbar{display:inline-flex;gap:2px}
.pr-mini .pbar i{display:block;width:8px;height:10px;border-radius:2px;background:var(--line)}
.pr-mini .pbar i.h{background:color-mix(in srgb,var(--mc) 45%,var(--line))}
.pr-mini .pbar i.f{background:var(--mc)}
.pr-mini b{color:var(--ink);font-weight:600}
.pr-empty{border:1px dashed var(--line);border-radius:12px;padding:18px 18px 16px;background:var(--surface);display:flex;flex-direction:column;gap:8px;max-width:640px}
.pr-empty p{margin:0;font-size:14px}
.pr-key{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 24px}
.pr-key div{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--line2);font-size:13px;min-width:0}
.pr-key b{font-weight:600;color:var(--ink)}
.pr-key span{color:var(--muted)}
.pr-back{background:none;border:0;color:var(--blue);cursor:pointer;padding:2px 0;font-size:14px;font-weight:600;margin:2px 0 10px}
.pr-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.pr-h{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em;line-height:1.08;overflow-wrap:anywhere}
.pr-st{gap:6px}
.meter{--mc:var(--notyet);margin-top:16px;border:1px solid var(--line);border-left:4px solid var(--mc);border-radius:12px;background:var(--surface);padding:16px 18px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 22px;align-items:center}
.meter.go{--mc:var(--green)}.meter.fit{--mc:var(--blue)}.meter.hold{--mc:var(--orange)}.meter.skip{--mc:var(--red)}
.meter .sc{font-family:var(--display);font-weight:800;font-size:48px;line-height:1;letter-spacing:-.03em;color:var(--mc)}
.meter .sc small{font-size:18px;color:var(--muted);font-weight:600;margin-left:2px;letter-spacing:0}
.meter .vd{display:flex;flex-direction:column;gap:3px;min-width:0}
.meter .vd b{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.02em;color:var(--mc)}
.meter .vd b.muted{color:var(--muted)}
.meter .vd span{font-size:13px;color:var(--muted)}
.meter .segs{grid-column:1/-1;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;margin-top:12px}
.meter .seg{display:flex;flex-direction:column;gap:5px;min-width:0;background:none;border:0;padding:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
.meter .seg .t{display:block;height:14px;border-radius:4px;background:var(--surface2);position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line2)}
.meter .seg .t i{position:absolute;left:0;top:0;bottom:0;background:var(--mc);transition:width .25s ease}
.meter .seg .t.miss{background:repeating-linear-gradient(135deg,var(--surface2) 0 4px,var(--line) 4px 6px)}
.meter .seg em{font-style:normal;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.meter .seg:hover em{color:var(--ink)}
.meter .meta{grid-column:1/-1;display:flex;gap:4px 16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.meter .meta b{color:var(--ink);font-weight:600}
.meter .meta .warnt{color:var(--orange);font-weight:600}
.pr-acts{margin-top:12px}
.pr-fields{margin-top:6px}
.pr-sec{padding:16px 0 14px;border-top:1px solid var(--line);scroll-margin-top:110px}
.pr-sec:first-of-type{border-top:0;padding-top:4px}
.pr-sec h3{color:var(--ink);font-size:15px;display:flex;gap:10px;align-items:baseline}

.pw-w9 i.s{width:60%}

.pw-ring text{font-family:var(--display);font-weight:800;font-size:19px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.pw-chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.pw-chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:1px 9px;font:600 11.5px var(--body);color:var(--muted);cursor:pointer;line-height:1.6}
.pw-chip:hover{border-color:var(--blue);color:var(--blue)}
.pw-chip.on{background:var(--green-soft);border-color:transparent;color:var(--green)}
.pw-chip.on:before{content:"✓ "}
.pw-sheet img.pw-big{display:block;width:100%;max-width:330px;margin:0 auto 14px;border:1px solid var(--line);border-radius:6px;background:var(--pw-paper);box-shadow:0 6px 18px rgba(21,33,58,.12)}
.pw-sheet .lede{margin:0 0 10px;font-size:14px}
.pw-sheet ol{margin:0 0 12px;padding-left:20px;font-size:14px}
.pw-sheet li{margin:0 0 6px}
.pw-sheet .note{margin-top:8px;font-size:13px}
.pw-sheet .tip{font-size:13px;color:var(--muted);margin:8px 0 0}

.pw-who:first-child{border-top:0}
.pw-who .n{font-weight:600}
.pw-who .pw-chips{margin-top:0;justify-content:flex-end}
.modal .sheet .btns a.btn.pri{color:#fff;border-color:var(--blue)}
@media (max-width:560px){.pw-who{grid-template-columns:1fr}.pw-who .pw-chips{justify-content:flex-start}}
</style>
<style>

:root[data-theme="dark"] .cc-tb b,:root[data-theme="dark"] .cc-fin,:root[data-theme="dark"] .cc-dt em,:root[data-theme="dark"] .cc-ch.fin .l:after{color:color-mix(in srgb,var(--pc) 55%,#fff)}

<style>
/* ---------- Console shell (Nov 3, 2026) ----------
   Layout: a console Home (greeting and clock, one search, a row picker, a single row of app tiles where the
   chosen tile grows, and a navy preview panel for that tile) and, inside an app, a slim sticky bar with Home,
   the app's own tile and name, and a strip of every app. Rows replace the old left rail; nothing inside the apps changed.
   Color keeps LEAD's rules: navy chrome, blue for the active thing, orange only for "needs you", green for Champions.
   Tile hues are identity only, never status. */
:root{
  --t-blue:#2f6fe0; --t-indigo:#4450b8; --t-sky:#1b7fb8; --t-teal:#13827b; --t-pine:#2c7656; --t-green:#2b8f3f;
  --t-violet:#6650c4; --t-plum:#9a3c80; --t-brick:#b0462d; --t-slate:#4b5a7a;
  --hero:#15213a; --hero2:#1f2e4f; --hero-fg:#ffffff; --hero-dim:#a9b6d3; --hero-line:rgba(255,255,255,.12);
  --topbar:rgba(246,247,251,.9); --ring:#15213a;
  --gut:max(16px,env(safe-area-inset-left,0px)); --gutr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --t-blue:#3f7ee8; --t-indigo:#5a66d0; --t-sky:#2b90c8; --t-teal:#1c968e; --t-pine:#358866; --t-green:#36a24b;
  --t-violet:#7a64d8; --t-plum:#b04f95; --t-brick:#c4573c; --t-slate:#5d6c8e;
  --hero:#18233f; --hero2:#212e52; --hero-fg:#ffffff; --hero-dim:#a3b0cf; --hero-line:rgba(255,255,255,.1);
  --topbar:rgba(15,22,38,.9); --ring:#e6ebf7 } }
:root[data-theme="dark"]{
  --t-blue:#3f7ee8; --t-indigo:#5a66d0; --t-sky:#2b90c8; --t-teal:#1c968e; --t-pine:#358866; --t-green:#36a24b;
  --t-violet:#7a64d8; --t-plum:#b04f95; --t-brick:#c4573c; --t-slate:#5d6c8e;
  --hero:#18233f; --hero2:#212e52; --hero-fg:#ffffff; --hero-dim:#a3b0cf; --hero-line:rgba(255,255,255,.1);
  --topbar:rgba(15,22,38,.9); --ring:#e6ebf7 }

body,:root[data-theme="dark"] body{background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
.sp{flex:1}
kbd{font:600 11px/1 var(--body);border:1px solid currentColor;border-bottom-width:2px;border-radius:5px;padding:2px 6px;opacity:.75}

/* ---------- the bar ---------- */
.shell-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--topbar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:10px;max-width:1220px;margin:0 auto;padding-block:10px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-height:62px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink);text-align:left}
.mark{width:34px;height:34px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font:800 19px/1 var(--display);letter-spacing:-.02em;flex:none}
:root[data-theme="dark"] .mark{background:var(--blue)}
.brand-txt{display:flex;flex-direction:column;line-height:1.1}
.brand-txt b{font:800 16px/1.1 var(--display);letter-spacing:-.01em}
.brand-txt small{font-size:12px;color:var(--muted)}
.home-btn{display:none;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 7px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink)}
.home-btn:hover{border-color:var(--blue);color:var(--blue)}
.home-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.crumb{display:none;align-items:center;gap:10px;min-width:0}
.crumb-ic{width:36px;height:36px;border-radius:11px;background:var(--tc,var(--t-blue));color:#fff;display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.crumb-ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.crumb .title-stack{min-width:0}
.crumb .eyebrow{color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.topbar .search{position:relative;flex:0 1 300px;min-width:150px}
.topbar .search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px 8px 34px;font-size:14px}

.results .k{font-size:12px;color:var(--muted)}

.status i.on{background:var(--green)}.status i.off{background:var(--orange)}
.viewpick{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.viewpick select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:13px;max-width:170px}

.appstrip{display:none;gap:2px;align-items:center;overflow-x:auto;scrollbar-width:none;max-width:1220px;margin:0 auto;padding-block:0;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}

.appstrip .cnt:empty{display:none}

:root[data-mode="app"] .brand{display:none}
:root[data-mode="app"] .home-btn,:root[data-mode="app"] .crumb{display:inline-flex}
:root[data-mode="app"] .appstrip{display:flex}
:root[data-mode="home"] .topbar .search,:root[data-mode="home"] .add-btn{display:none}

.stage{max-width:1220px;margin:0 auto;padding-block:18px 40px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0}
.shell-foot{max-width:1220px;margin:0 auto;padding-block:0 calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));font-size:12px;color:var(--muted)}
.shell-foot span:empty{display:none}
.cu-toc,.cu-block .who button{top:124px}
.cu-read [id],.pr-sec{scroll-margin-top:124px}

/* ---------- Home ---------- */
